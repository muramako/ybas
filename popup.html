<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ybas</title>
<style>
  body {
    width: 220px;
    margin: 0;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .title {
    font-size: 14px;
    font-weight: 600;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 40px;
    height: 22px;
    flex-shrink: 0;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .slider {
    position: absolute;
    inset: 0;
    background: #ccc;
    border-radius: 22px;
    cursor: pointer;
    transition: background-color .15s;
  }
  .slider::before {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    left: 2px;
    top: 2px;
    background: #fff;
    border-radius: 50%;
    transition: transform .15s;
  }
  input:checked + .slider {
    background: #1a73e8;
  }
  input:checked + .slider::before {
    transform: translateX(18px);
  }
  .desc {
    margin-top: 8px;
    font-size: 12px;
    color: #666;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="row">
    <span class="title">自動スワイプ</span>
    <label class="switch">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </div>
  <div class="desc">YouTube Shortsの再生終了時に自動で次の動画へ切り替えます。</div>
  <script src="popup.js"></script>
</body>
</html>
